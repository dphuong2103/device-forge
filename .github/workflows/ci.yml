name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: go test -race -cover ./cmd/... ./internal/...
      - run: go vet ./cmd/... ./internal/...
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Build Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: go build -trimpath -o artifacts/ ./cmd/...

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
